name: Erkenly CI

on:
  push:
    branches:
      - main
      - master
      - redis-railway-deployment
  pull_request:

jobs:
  build-and-test-client:
    name: Build Qt app and run unit tests
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: 'desktop'
          arch: 'linux_gcc_64'

      - name: Configure CMake
        run: |
          rm -rf build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build project and tests
        run: |
          cmake --build build

      - name: Run unit tests
        run: |
          ctest --test-dir build --output-on-failure

  build-server:
    name: Build Boost.Asio Redis server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install server dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libboost-all-dev libhiredis-dev pkg-config

      - name: Configure server
        run: |
          rm -rf server/build
          cmake -S server -B server/build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build server
        run: |
          cmake --build server/build